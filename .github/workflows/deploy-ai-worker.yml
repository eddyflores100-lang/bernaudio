name: Deploy BernAudio AI Worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/assistant/**'
      - 'scripts/deploy-ai-worker.mjs'
      - '.github/workflows/deploy-ai-worker.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: faf93cd2a0d373573de0859b1cc95328
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-ai-worker.mjs
